      width: 5px;

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `bg-[#4A3B32] text-white text-xs px-4 py-2.5 rounded-2xl shadow-xl flex items-center gap-2 animate-fadeIn border border-[#D0B8A0]`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // Clean dish name from NEIS HTML and allergy tags (e.g. 1.2.5.6.)
    function cleanDishName(rawHtml) {
      if (!rawHtml) return [];
      return rawHtml
        .replace(/<br\s*\/?>/gi, '\n')
        .split('\n')
        .map(dish => dish.replace(/\([0-9\.\s]+\)/g, '').replace(/[0-9\.]+/g, '').trim())

    // Fetch School Data from NEIS Hub OpenAPI
    async function fetchSchoolData(school, yearMonthStr) {
      state.isLoading = true;
      renderTab();

      const year = yearMonthStr.slice(0, 4);
      const month = yearMonthStr.slice(4, 6);
      
      // Calculate start and end date of month
      const lastDay = new Date(parseInt(year), parseInt(month), 0).getDate();
      const fromYmd = `${yearMonthStr}01`;
      const toYmd = `${yearMonthStr}${String(lastDay).padStart(2, '0')}`;

      const apiKeyParam = state.neisApiKey ? `&KEY=${state.neisApiKey}` : '';
      const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];

      // 1. Fetch Meal Service Info
      try {
        const mealUrl = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=100${apiKeyParam}&ATPT_OFCDC_SC_CODE=${school.officeCode}&SD_SCHUL_CODE=${school.code}&MLSV_FROM_YMD=${fromYmd}&MLSV_TO_YMD=${toYmd}`;
        const mealRes = await fetch(mealUrl);
        const mealData = await mealRes.json();

        if (mealData.mealServiceDietInfo && mealData.mealServiceDietInfo[1]?.row) {
          const rows = mealData.mealServiceDietInfo[1].row;
          state.meals = rows.map((row, idx) => {
            const rawDD = row.MLSV_YMD;
            const formattedDate = `${rawDD.slice(0,4)}-${rawDD.slice(4,6)}-${rawDD.slice(6,8)}`;
            const dateObj = new Date(formattedDate);
            const dayName = daysOfWeek[dateObj.getDay()] || '';
            const cleanedItems = cleanDishName(row.DDISH_NM);

            return {
              day: dayName,
              date: formattedDate,
              menuTitle: cleanedItems[0] ? cleanedItems[0] : '학교 급식',
              img: FOOD_IMAGES[idx % FOOD_IMAGES.length],
              items: cleanedItems,
              calories: row.CAL_INFO || '정보 없음',
              mealType: row.MMEAL_SC_NM || '중식'
            };
          });
        } else {
          state.meals = [];
        }
      } catch (err) {
        console.error('NEIS Meal API Fetch Error:', err);
        state.meals = [];
      }

      // 2. Fetch School Schedule Info
      try {
        const schedUrl = `https://open.neis.go.kr/hub/SchoolSchedule?Type=json&pIndex=1&pSize=100${apiKeyParam}&ATPT_OFCDC_SC_CODE=${school.officeCode}&SD_SCHUL_CODE=${school.code}&AA_FROM_YMD=${fromYmd}&AA_TO_YMD=${toYmd}`;
        const schedRes = await fetch(schedUrl);
        const schedData = await schedRes.json();

        if (schedData.SchoolSchedule && schedData.SchoolSchedule[1]?.row) {
          const rows = schedData.SchoolSchedule[1].row;
          state.events = rows
            .filter(row => row.EVENT_NM && row.EVENT_NM.trim() !== '토요휴업일')
            .map(row => {
              const rawDD = row.AA_YMD;
              const formattedDate = `${rawDD.slice(0,4)}-${rawDD.slice(4,6)}-${rawDD.slice(6,8)}`;
              let type = '행사';
              if (row.EVENT_NM.includes('시험') || row.EVENT_NM.includes('고사')) type = '시험';
              else if (row.EVENT_NM.includes('방학') || row.EVENT_NM.includes('휴업')) type = '휴일';
              else if (row.EVENT_NM.includes('개학') || row.EVENT_NM.includes('입학')) type = '학사';

              return {
                date: formattedDate,
                title: row.EVENT_NM.trim(),
                type: type,
                content: row.EVENT_CNTNT || ''
              };
            });
        } else {
          state.events = [];
        }
      } catch (err) {
        console.error('NEIS Schedule API Fetch Error:', err);
        state.events = [];
      }

      state.isLoading = false;
      renderTab();
    }

              </button>
              <button id="btn-pet-pig" class="bg-[#8A9A86] hover:bg-[#788874] text-white p-3 rounded-2xl font-bold text-xs shadow transition-all active:scale-95">
                🤚 쓰다듬기 (행복 상승)
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderChatTab() {
      return `
        <div class="flex flex-col h-[72vh] animate-fadeIn">
          <div class="bg-[#FAF0E6] p-3 rounded-2xl border border-[#E8D8C8] flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-[#D87A56] flex items-center justify-center p-0.5">
                ${getPixelGrandmaSvg('w-full h-full')}
              </div>
              <div>
                <h2 class="font-bold text-sm text-[#4A3B32]">마음회관 수다방 (할머니 AI)</h2>
                <p class="text-[11px] text-[#8C6A50]">수다를 떨면 무작위로 스낵(🍎)이 제공됩니다!</p>
              </div>
            </div>
            <span class="text-[10px] bg-[#7C9473] text-white px-2 py-0.5 rounded font-bold">
              Gemini AI
            </span>
          </div>

          <div id="chat-messages-container" class="flex-1 overflow-y-auto space-y-3 p-3 bg-[#FAF5ED] rounded-2xl border border-[#E8DCD0]">
            ${state.chatMessages.map(msg => `
              <div class="flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}">
                <div class="max-w-[80%] rounded-2xl p-3 text-xs leading-relaxed shadow-sm ${
                  msg.sender === 'user' 
                    ? 'bg-[#D87A56] text-white rounded-br-none' 
                    : 'bg-white text-[#4A3B32] border border-[#E0D0C0] rounded-bl-none'
                }">
                  ${msg.sender === 'grandma' ? `
                    <div class="font-bold text-[10px] text-[#D87A56] mb-1 flex items-center gap-1">
                      <div class="w-4 h-4 inline-block">${getPixelGrandmaSvg('w-full h-full')}</div>
                      시골 할머니
                    </div>
                  ` : ''}
                  ${msg.text}
                </div>
              </div>
            `).join('')}

            ${state.isChatTyping ? `
              <div class="flex justify-start">
                <div class="bg-white text-[#8C6A50] border border-[#E0D0C0] rounded-2xl rounded-bl-none p-3 text-xs font-bold animate-pulse">
                  👵 할머니가 안경을 고쳐쓰고 답변을 작성 중이란다...
                </div>
              </div>
            ` : ''}
          </div>

          <div class="mt-3 flex gap-2">
            <input type="text" id="chat-input-text" placeholder="할머니, 오늘 학교 급식 맛있는거야? or 자유 대화" class="flex-1 bg-white border border-[#D0B8A0] rounded-xl px-3.5 py-2.5 text-xs text-[#4A3B32] focus:outline-none focus:border-[#D87A56] shadow-inner">
            <button id="btn-send-chat" class="bg-[#D87A56] hover:bg-[#C26946] text-white px-4 rounded-xl font-bold text-xs flex items-center justify-center transition-all active:scale-95 shadow">
              <i data-lucide="send" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `;
    }

    function attachTabEvents() {
      // Home Tab Events
      const btnCheckin = document.getElementById('btn-checkin');
      if (btnCheckin) {
        btnCheckin.addEventListener('click', () => {
          if (state.hasCheckedIn) return;
          state.hasCheckedIn = true;
          state.pigState.snackCount += 2;
          state.pigState.quote = '출석 보상으로 맛있는 스낵 2개를 받았단다! 꿀꿀!';
          showToast('🎁 출석 완료! 스낵 2개가 추가되었습니다.');
          renderTab();
        });
      }

      const btnGoMeals = document.getElementById('btn-go-meals');
      if (btnGoMeals) btnGoMeals.addEventListener('click', () => switchTab('meals'));

      const btnGoPig = document.getElementById('btn-go-pig');
      if (btnGoPig) btnGoPig.addEventListener('click', () => switchTab('pig'));

      // Meal Month Navigation
      const btnPrevMeal = document.getElementById('btn-prev-month-meal');
      const btnNextMeal = document.getElementById('btn-next-month-meal');
      if (btnPrevMeal) btnPrevMeal.addEventListener('click', () => changeMonth(-1));
      if (btnNextMeal) btnNextMeal.addEventListener('click', () => changeMonth(1));

      // Calendar Month Navigation
      const btnPrevCal = document.getElementById('btn-prev-month-cal');
      const btnNextCal = document.getElementById('btn-next-month-cal');
      if (btnPrevCal) btnPrevCal.addEventListener('click', () => changeMonth(-1));
      if (btnNextCal) btnNextCal.addEventListener('click', () => changeMonth(1));

      // Pig Events
      const btnFeed = document.getElementById('btn-feed-pig');
      if (btnFeed) {
        btnFeed.addEventListener('click', () => {
          if (state.pigState.snackCount <= 0) {
            showToast('🍎 스낵이 부족합니다! 출석체크나 할머니와 수다를 떨어보세요!');
            return;
          }
          state.pigState.snackCount--;
          state.pigState.hunger = Math.min(100, state.pigState.hunger + 25);
          state.pigState.happiness = Math.min(100, state.pigState.happiness + 10);
          state.pigState.exp += 20;

          if (state.pigState.exp >= state.pigState.maxExp) {
            state.pigState.level++;
            state.pigState.exp %= state.pigState.maxExp;
            state.pigState.maxExp += 50;
            state.pigState.quote = '축하한다! 돼지가 무럭무럭 자라 레벨업을 했단다!';
          } else {
            state.pigState.quote = '꿀꿀! 맛있는 급식 잔반을 냠냠 먹었단다!';
          }

          state.showHearts = true;
          renderTab();
          setTimeout(() => {
            state.showHearts = false;
            const area = document.getElementById('heart-animation-area');
            if (area) area.classList.add('hidden');
          }, 1500);
        });
      }

      const btnPet = document.getElementById('btn-pet-pig');
      if (btnPet) {
        btnPet.addEventListener('click', () => {
          state.pigState.happiness = Math.min(100, state.pigState.happiness + 15);
          state.pigState.quote = '돼지가 기분이 좋아서 꼬리를 살랑살랑 친단다! 꿀~';
          renderTab();
        });
      }

      // Chat Events
      const btnSendChat = document.getElementById('btn-send-chat');
      const chatInput = document.getElementById('chat-input-text');
      if (btnSendChat && chatInput) {
        const handleSend = () => {
          const val = chatInput.value.trim();
          if (!val || state.isChatTyping) return;

          state.chatMessages.push({ id: Date.now(), sender: 'user', text: val });
          chatInput.value = '';
          state.isChatTyping = true;
          renderTab();

          scrollChatToBottom();
          sendAiChatResponse(val);
        };

        btnSendChat.addEventListener('click', handleSend);
        chatInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') handleSend();
        });
      }
    }

    function changeMonth(delta) {
      let y = parseInt(state.currentYearMonth.slice(0, 4));
      let m = parseInt(state.currentYearMonth.slice(4, 6)) + delta;

      if (m > 12) {
        y += 1;
        m = 1;
      } else if (m < 1) {
        y -= 1;
        m = 12;
      }

      state.currentYearMonth = `${y}${String(m).padStart(2, '0')}`;
      fetchSchoolData(state.selectedSchool, state.currentYearMonth);
    }

    async function sendAiChatResponse(userMsg) {
      const apiKey = state.geminiApiKey.trim();
      const todayMeal = state.meals.find(m => m.date === todayStr);
      const mealInfoText = todayMeal 
        ? `오늘 급식 메뉴: ${todayMeal.items.join(', ')} (${todayMeal.calories})` 
        : '오늘 급식 정보 없음';

      const systemPrompt = `당신은 시골 한옥집에 사는 다정하고 따뜻한 '시골 할머니'입니다. 
말투는 항상 한국 시골 할머니의 정감 어린 구수한 어조(~했단다, ~했냐?, 오냐 우리 강아지, 밥은 먹고 다니냐 등)를 유지하세요.
사용자가 선택한 학교는 [${state.selectedSchool.name}]입니다.
오늘 급식 정보: ${mealInfoText}
사용자의 질문에 정겹게 답해주세요.`;

      let replyText = '';

      if (apiKey) {
        try {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
          const payload = {
            contents: [{ parts: [{ text: userMsg }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] }
          };

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await response.json();
          replyText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        } catch (err) {
          console.warn('Gemini API fetch error:', err);
        }
      }

      if (!replyText) {
        await new Promise(res => setTimeout(res, 800));
        if (userMsg.includes('급식') || userMsg.includes('밥') || userMsg.includes('점심')) {
          replyText = todayMeal 
            ? `오냐 우리 강아지~ 오늘 ${state.selectedSchool.name} 점심은 ${todayMeal.items.slice(0, 3).join(', ')} 등이 나온단다. 남기지 말고 싹싹 다 먹어야 한단다!`
            : `오늘 ${state.selectedSchool.name} 급식은 휴업일이거나 정보가 없구나. 집에서 할미랑 같이 밥 먹자꾸나!`;
        } else {
          replyText = `오냐 우리 강아지~ ${state.selectedSchool.name} 다니느라 고생이 많구나! 밥은 꼭 챙겨먹고 건강하거라~`;
        }
      }

      state.isChatTyping = false;
      state.chatMessages.push({ id: Date.now() + 1, sender: 'grandma', text: replyText });

      if (Math.random() > 0.4) {
        state.pigState.snackCount++;
        showToast('🍎 할머니와 대화하여 스낵 1개를 선물받았습니다!');
      }

      renderTab();
      scrollChatToBottom();
    }

    function scrollChatToBottom() {
      const container = document.getElementById('chat-messages-container');
      if (container) {
        container.scrollTop = container.scrollHeight;
      }
    }

    function switchTab(tabId) {
      state.activeTab = tabId;

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isTarget = btn.dataset.tab === tabId;
        btn.className = `nav-btn flex flex-col items-center justify-center px-3 py-1.5 rounded-xl transition-all ${
          isTarget 
            ? 'text-[#D87A56] font-bold bg-[#F3E2D0]' 
            : 'text-[#8C7462] hover:text-[#5C4535]'
        }`;
      });

      renderTab();
    }

    function renderTab() {
      const main = document.getElementById('main-content');
      if (!main) return;

      if (state.activeTab === 'home') main.innerHTML = renderHomeTab();
      else if (state.activeTab === 'meals') main.innerHTML = renderMealsTab();
      else if (state.activeTab === 'calendar') main.innerHTML = renderCalendarTab();
      else if (state.activeTab === 'pig') main.innerHTML = renderPigTab();
      else if (state.activeTab === 'chat') main.innerHTML = renderChatTab();

      lucide.createIcons();
      attachTabEvents();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const updateHeaderBadge = () => {
        const badge = document.getElementById('header-school-badge');
        if (badge) {
          badge.textContent = state.selectedSchool.name.replace(/(초등학교|중학교|고등학교)/, '');
        }
      };

      // Populate Office Select
      const officeSelect = document.getElementById('office-select');
      if (officeSelect) {
        officeSelect.innerHTML = EDUCATION_OFFICES.map(o => `
          <option value="${o.code}">${o.name}</option>
        `).join('');
      }

      // Open / Close Modals
      const modalSchool = document.getElementById('modal-school');
      const modalApi = document.getElementById('modal-api');

      document.getElementById('btn-open-school')?.addEventListener('click', () => {
        modalSchool.classList.remove('hidden');
      });
      document.getElementById('btn-close-school')?.addEventListener('click', () => {
        modalSchool.classList.add('hidden');
      });

      document.getElementById('btn-open-api')?.addEventListener('click', () => {
        const neisKeyInput = document.getElementById('neis-key-input');
        const geminiKeyInput = document.getElementById('gemini-key-input');
        if (neisKeyInput) neisKeyInput.value = state.neisApiKey;
        if (geminiKeyInput) geminiKeyInput.value = state.geminiApiKey;
        modalApi.classList.remove('hidden');
      });
      document.getElementById('btn-close-api')?.addEventListener('click', () => {
        modalApi.classList.add('hidden');
      });

      document.getElementById('btn-save-api')?.addEventListener('click', () => {
        const neisKeyInput = document.getElementById('neis-key-input');
        const geminiKeyInput = document.getElementById('gemini-key-input');
        if (neisKeyInput) {
          state.neisApiKey = neisKeyInput.value.trim();
          localStorage.setItem('neis_api_key', state.neisApiKey);
        }
        if (geminiKeyInput) {
          state.geminiApiKey = geminiKeyInput.value.trim();
          localStorage.setItem('gemini_api_key', state.geminiApiKey);
        }
        showToast('🔑 API 키 설정이 저장되었습니다!');
        modalApi.classList.add('hidden');
        fetchSchoolData(state.selectedSchool, state.currentYearMonth);
      });

      // School Search Execution using Real NEIS Hub schoolInfo API
      const btnSearchSchool = document.getElementById('btn-search-school');
      const schoolQueryInput = document.getElementById('school-query-input');
      const schoolResultsContainer = document.getElementById('school-search-results');

      const executeSchoolSearch = async () => {
        const query = schoolQueryInput.value.trim();
        if (!query) return;

        schoolResultsContainer.innerHTML = `<div class="text-center py-4 text-xs text-[#8C7462]">나이스에서 학교 검색 중...</div>`;
        const selectedOffice = officeSelect.value;

        try {
          const apiKeyParam = state.neisApiKey ? `&KEY=${state.neisApiKey}` : '';
          const officeParam = selectedOffice ? `&ATPT_OFCDC_SC_CODE=${selectedOffice}` : '';
          const url = `https://open.neis.go.kr/hub/schoolInfo?Type=json&pIndex=1&pSize=50${apiKeyParam}${officeParam}&SCHUL_NM=${encodeURIComponent(query)}`;
          
          const res = await fetch(url);
          const data = await res.json();

          if (data.schoolInfo && data.schoolInfo[1]?.row) {
            const list = data.schoolInfo[1].row.map(item => ({
              code: item.SD_SCHUL_CODE,
              name: item.SCHUL_NM,
              officeCode: item.ATPT_OFCDC_SC_CODE,
              officeName: item.ATPT_OFCDC_SC_NM,
              location: item.ORG_RDNMA || item.ORG_LNM || '시도 교육청 지역'
            }));

            renderSchoolSearchResults(list);
          } else {
            schoolResultsContainer.innerHTML = `<div class="text-center py-6 text-xs text-[#8C7462]">검색 결과가 없습니다. 학교 이름을 다시 확인해 보세요.</div>`;
          }
        } catch (err) {
          console.error('School Search Error:', err);
          schoolResultsContainer.innerHTML = `<div class="text-center py-6 text-xs text-red-500">학교 검색 중 오류가 발생했습니다.</div>`;
        }
      };

      function renderSchoolSearchResults(results) {
        schoolResultsContainer.innerHTML = results.map((item, idx) => `
          <button data-index="${idx}" class="btn-select-school w-full text-left bg-white hover:bg-[#F3E2D0] p-2.5 rounded-xl border border-[#E8DCD0] transition-all flex items-center justify-between">
            <div>
              <div class="font-bold text-xs text-[#4A3B32]">${item.name}</div>
              <div class="text-[10px] text-[#8C6A50]">${item.officeName} | ${item.location}</div>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-[#D87A56]"></i>
          </button>
        `).join('');

        lucide.createIcons();

        document.querySelectorAll('.btn-select-school').forEach((btn) => {
          btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.index);
            const chosen = results[idx];
            state.selectedSchool = chosen;
            localStorage.setItem('selected_school', JSON.stringify(chosen));
            
            updateHeaderBadge();
            modalSchool.classList.add('hidden');
            showToast(`🏫 ${chosen.name}(으)로 변경되었습니다.`);
            
            fetchSchoolData(chosen, state.currentYearMonth);
          });
        });
      }

      if (btnSearchSchool) btnSearchSchool.addEventListener('click', executeSchoolSearch);
      if (schoolQueryInput) {
        schoolQueryInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') executeSchoolSearch();
        });
      }

      // Nav Tab Bar Listeners
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          switchTab(btn.dataset.tab);
        });
      });

      // Initial Fetch & Render
      updateHeaderBadge();
      fetchSchoolData(state.selectedSchool, state.currentYearMonth);
    });
  </script>
</body>
</html>
