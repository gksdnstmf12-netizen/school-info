  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #F7F1E5;
      color: #4A3B32;
      user-select: none;
    }
    .pixel-crisp {
      shape-rendering: crispEdges;
      image-rendering: pixelated;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(10px) scale(0.8); opacity: 0; }
      50% { transform: translateY(-15px) scale(1.2); opacity: 1; }
      100% { transform: translateY(-35px) scale(1); opacity: 0; }
    }
    .animate-float-1 { animation: floatUp 1.2s ease-out forwards; }
    .animate-float-2 { animation: floatUp 1.4s ease-out 0.2s forwards; }
    .animate-float-3 { animation: floatUp 1.3s ease-out 0.1s forwards; }

    /* 방귀 애니메이션 */
    @keyframes fartShake {
      0%, 100% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(1.15) rotate(-10deg) translateY(-4px); }
      40% { transform: scale(1.2) rotate(12deg) translateY(-8px); }
      60% { transform: scale(1.1) rotate(-8deg); }
      80% { transform: scale(1.05) rotate(5deg); }
    }
    .animate-fart { animation: fartShake 0.8s ease-in-out; }

    /* 통통 튀는 애니메이션 */
    @keyframes doubleBounce {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-16px); }
      50% { transform: translateY(0); }
      75% { transform: translateY(-10px); }
    }
    .animate-double-bounce { animation: doubleBounce 0.6s ease-in-out; }

    /* 춤/애교 애니메이션 */
    @keyframes wiggleJump {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      20% { transform: translateY(-12px) rotate(-8deg); }
      40% { transform: translateY(0) rotate(8deg); }
      60% { transform: translateY(-12px) rotate(-8deg); }
      80% { transform: translateY(0) rotate(8deg); }
    }
    .animate-wiggle-jump { animation: wiggleJump 0.7s ease-in-out; }

    /* 배 뒤집기 애니메이션 */
    @keyframes bellyUp {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.1) rotate(15deg) translateY(-8px); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .animate-belly-up { animation: bellyUp 0.8s ease-in-out; }

    /* 화남(지진) 애니메이션 */
    @keyframes shakeAngry {
      0%, 100% { transform: scale(1.1) translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: scale(1.15) translateX(-8px) rotate(-5deg); filter: drop-shadow(0 0 10px rgba(255,0,0,0.5)); }
      20%, 40%, 60%, 80% { transform: scale(1.15) translateX(8px) rotate(5deg); filter: drop-shadow(0 0 10px rgba(255,0,0,0.5)); }
    }
    .animate-shake-angry { animation: shakeAngry 0.6s ease-in-out infinite; }

    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #FDF8EE;
    }
    ::-webkit-scrollbar-thumb {
      background: #E8D8C8;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #D87A56;
    }
  </style>

    // 특정 기준 날짜(baseDate)를 입력받아 해당 주의 월~금 범위 반환
    function getWeekRange(baseDate) {
      const d = new Date(baseDate);
      const day = d.getDay();
      const diffToMon = d.getDate() - day + (day === 0 ? -6 : 1);
      
      const mon = new Date(d.setDate(diffToMon));
      const fri = new Date(mon);
      fri.setDate(mon.getDate() + 4);

      const formatDate = (dateObj) => {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const dayNum = String(dateObj.getDate()).padStart(2, '0');
        return `${y}${m}${dayNum}`;
      };

      return {
        monDate: mon,
        friDate: fri,
        fromYmd: formatDate(mon),
        toYmd: formatDate(fri)
      };
    }

    function showToast(message) {

      const toast = document.createElement('div');
      toast.className = `bg-[#4A3B32] text-white text-xs px-4 py-2.5 rounded-2xl shadow-xl flex items-center gap-2 animate-fadeIn border border-[#D0B8A0]`;

    function cleanDishName(rawHtml) {
      if (!rawHtml) return { items: [], allergyInfo: '' };
      const cleanText = rawHtml.replace(/<br\s*\/?>/gi, '\n');
      const lines = cleanText.split('\n');
      const items = [];
      let allergyInfo = '';

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;
        const allergyMatch = trimmed.match(/[\(\.]([0-9\.\s]+)[\)\.]?$/);
        if (allergyMatch) allergyInfo = allergyMatch[1];
        const dishName = trimmed.replace(/\([0-9\.\s]+\)/g, '').replace(/[0-9\.]+/g, '').trim();
        if (dishName.length > 0) items.push(dishName);
      });

      return { items, allergyInfo };
    }

    // 급식 데이터만 요청하는 함수 (주간 이동 시 사용)
    async function fetchMealData(school, baseDate) {
      state.isLoadingMeals = true;
      state.hasMealError = false;
      renderTab(); // 로딩 UI 표시

      const apiKeyParam = state.neisApiKey ? `&KEY=${state.neisApiKey}` : '';
      const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];

      try {
        const weekRange = getWeekRange(baseDate);
        const mealUrl = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=10${apiKeyParam}&ATPT_OFCDC_SC_CODE=${school.officeCode}&SD_SCHUL_CODE=${school.code}&MLSV_FROM_YMD=${weekRange.fromYmd}&MLSV_TO_YMD=${weekRange.toYmd}`;
        const mealRes = await fetch(mealUrl);
        const mealData = await mealRes.json();

        if (mealData.mealServiceDietInfo && mealData.mealServiceDietInfo[1]?.row) {
          const rows = mealData.mealServiceDietInfo[1].row;
          state.meals = rows.map((row, idx) => {
            const rawDD = row.MLSV_YMD;
            const formattedDate = `${rawDD.slice(0,4)}-${rawDD.slice(4,6)}-${rawDD.slice(6,8)}`;
            const dateObj = new Date(formattedDate);
            const dayName = daysOfWeek[dateObj.getDay()] || '';
            const cleaned = cleanDishName(row.DDISH_NM);

            return {
              day: dayName,
              date: formattedDate,
              menuTitle: cleaned.items[0] ? cleaned.items[0] : '학교 급식',
              img: FOOD_IMAGES[idx % FOOD_IMAGES.length],
              items: cleaned.items,
              allergy: cleaned.allergyInfo,
              calories: row.CAL_INFO || '정보 없음',
              mealType: row.MMEAL_SC_NM || '중식'
            };
          });
        } else {
          state.meals = [];
        }
      } catch (err) {
        console.error('NEIS Meal API Fetch Error:', err);
        state.hasMealError = true;
        state.mealErrorMessage = '급식 데이터를 불러오지 못했습니다.';
      }

      state.isLoadingMeals = false;
      renderTab();
    }

    // 일정 데이터만 요청하는 함수 (월 변경 시 사용)
    async function fetchCalendarData(school, yearMonthStr) {
      const year = yearMonthStr.slice(0, 4);
      const month = yearMonthStr.slice(4, 6);
      const lastDay = new Date(parseInt(year), parseInt(month), 0).getDate();
      const fromYmd = `${yearMonthStr}01`;
      const toYmd = `${yearMonthStr}${String(lastDay).padStart(2, '0')}`;
      const apiKeyParam = state.neisApiKey ? `&KEY=${state.neisApiKey}` : '';

      try {
        const schedUrl = `https://open.neis.go.kr/hub/SchoolSchedule?Type=json&pIndex=1&pSize=100${apiKeyParam}&ATPT_OFCDC_SC_CODE=${school.officeCode}&SD_SCHUL_CODE=${school.code}&AA_FROM_YMD=${fromYmd}&AA_TO_YMD=${toYmd}`;
        const schedRes = await fetch(schedUrl);
        const schedData = await schedRes.json();

        if (schedData.SchoolSchedule && schedData.SchoolSchedule[1]?.row) {
          const rows = schedData.SchoolSchedule[1].row;
          state.events = rows
            .filter(row => row.EVENT_NM && row.EVENT_NM.trim() !== '토요휴업일')
            .map(row => {
              const rawDD = row.AA_YMD;
              const formattedDate = `${rawDD.slice(0,4)}-${rawDD.slice(4,6)}-${rawDD.slice(6,8)}`;
              let type = '행사';
              if (row.EVENT_NM.includes('시험') || row.EVENT_NM.includes('고사')) type = '시험';
              else if (row.EVENT_NM.includes('방학') || row.EVENT_NM.includes('휴업')) type = '휴일';
              else if (row.EVENT_NM.includes('개학') || row.EVENT_NM.includes('입학')) type = '학사';

              return {
                date: formattedDate,
                title: row.EVENT_NM.trim(),
                type: type,
                content: row.EVENT_CNTNT || ''
              };
            });
        } else {
          state.events = [];
        }
      } catch (err) {
        console.error('NEIS Schedule API Fetch Error:', err);
      }
      renderTab();
    }

    function renderCalendarTab() {
      const year = state.currentYearMonth.slice(0, 4);
      const month = parseInt(state.currentYearMonth.slice(4, 6));

      const firstDayOfMonth = new Date(parseInt(year), month - 1, 1).getDay();
      const daysInMonth = new Date(parseInt(year), month, 0).getDate();

      return `
        <div class="space-y-4 animate-fadeIn">

              ${state.selectedSchool.name}
            </span>

                <i data-lucide="chevron-left" class="w-4 h-4"></i> 이전 달
              </button>
              <span>${year}년 ${month}월</span>
              <button id="btn-next-month-cal" class="p-1 hover:bg-[#FAF3E5] rounded-lg transition-colors flex items-center gap-1 text-xs">
                다음 달 <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="grid grid-cols-7 gap-1 text-center text-xs">
              ${['일','월','화','수','목','금','토'].map((d, i) => `
                <div class="font-bold py-1 ${i === 0 ? 'text-red-500' : i === 6 ? 'text-blue-500' : 'text-[#6E5A4C]'}">${d}</div>
              `).join('')}

              ${Array.from({ length: firstDayOfMonth }).map(() => `
                <div class="p-1.5 opacity-0"></div>
              `).join('')}

              ${Array.from({ length: daysInMonth }, (_, i) => i + 1).map(day => {
                const dayStr = String(day).padStart(2, '0');
                const matchDateStr = `${year}-${String(month).padStart(2, '0')}-${dayStr}`;
                const dayEvents = state.events.filter(e => e.date === matchDateStr);
                const hasEvent = dayEvents.length > 0;
                const isToday = matchDateStr === todayStr;

                return `
                  <div class="min-h-[42px] p-1 rounded-xl flex flex-col items-center justify-start font-semibold relative border ${
                    isToday ? 'border-2 border-[#D87A56] bg-[#FFE4D6]' :
                    hasEvent ? 'bg-[#FDE2D1] text-[#C04818] border-[#F3BCA0]' : 
                    'hover:bg-[#FAF3E5] text-[#5C483A] border-transparent'
                  }">
                    <span class="${isToday ? 'font-extrabold text-[#D87A56]' : ''}">${day}</span>
                    ${hasEvent ? `
                      <span class="w-1.5 h-1.5 bg-[#D87A56] rounded-full mt-0.5"></span>
                      <span class="text-[9px] text-[#A03000] truncate w-full px-0.5 leading-tight mt-0.5 font-normal">

        </div>
      `;

    function renderClosetItemsGrid() {
      const grid = document.getElementById('closet-items-grid');

      if (!grid || !preview) return;

      preview.innerHTML = getPixelPigSvg('normal', false, 'w-24 h-24', state.tempEquippedItems);

      const itemsList = ACCESSORIES[state.activeClosetTab] || [];
      const currentSelected = state.tempEquippedItems[state.activeClosetTab];

      grid.innerHTML = itemsList.map(item => {
        const isSelected = currentSelected === item.id;
        return `
          <button data-item-id="${item.id}" class="btn-closet-item p-2 rounded-2xl border ${
            isSelected ? 'border-2 border-[#D87A56] bg-[#FFE4D6]' : 'border-[#E0D0C0] bg-white hover:bg-[#FAF3E5]'
          } flex items-center gap-2 text-left transition-all active:scale-95">
            <span class="text-2xl">${item.icon}</span>
            <span class="text-xs font-bold text-[#4A3B32] truncate">${item.name}</span>
          </button>
        `;
      }).join('');

      document.querySelectorAll('.btn-closet-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const itemId = btn.dataset.itemId;
          if (state.tempEquippedItems[state.activeClosetTab] === itemId) {
            state.tempEquippedItems[state.activeClosetTab] = null;
          } else {
            state.tempEquippedItems[state.activeClosetTab] = itemId;

          renderClosetItemsGrid();

            state.pigClickCount = 0;

            state.showEffect = true;

            const svgContainer = document.getElementById('pig-svg-container');
            if (svgContainer) {

                state.pigExpression = 'normal';

              state.pigExpression = 'normal';
              state.pigHoldingApple = false;
              state.showEffect = false;
              updatePigUI();

            state.pigClickCount = 0;
          }, 1500);

      const btnFeed = document.getElementById('btn-feed-pig');

            return;
          }
          state.pigState.snackCount--;
          state.pigState.hunger = Math.min(100, state.pigState.hunger + 25);
          state.pigState.happiness = Math.min(100, state.pigState.happiness + 10);
          state.pigState.exp += 20;

          if (state.pigState.exp >= state.pigState.maxExp) {
            state.pigState.level++;
            state.pigState.exp %= state.pigState.maxExp;
            state.pigState.maxExp += 50;
            state.pigSpeech = '우와! 레벨업을 했어! 사과 냠냠 꿀맛이야! 🏆';
          } else {
            state.pigSpeech = '냠냠쩝쩝! 사과 스낵 정말 달콤하고 맛있어! 🍎';
          }

          state.showEffect = true;
          state.effectType = 'hearts';
          state.pigExpression = 'heart';
          state.pigHoldingApple = true;
          
          const svgContainer = document.getElementById('pig-svg-container');

            svgContainer.classList.remove('animate-double-bounce', 'animate-wiggle-jump', 'animate-belly-up', 'animate-fart', 'animate-shake-angry');

              state.pigExpression = 'normal';
              state.pigHoldingApple = false;
              updatePigUI();

              state.showEffect = false;
              state.pigExpression = 'normal';
              updatePigUI();

          }, 2500);

              state.pigSpeech = '하품~! 개운하게 잘 잤다! 꿀꿀!';
              updatePigUI();
            }
          }, 3000);
        });

              state.pigExpression = 'normal';
              updatePigUI();
            }

        });

      const btnSendChat = document.getElementById('btn-send-chat');
      const chatInput = document.getElementById('chat-input-text');
      if (btnSendChat && chatInput) {
        const handleSend = async () => {
          const text = chatInput.value.trim();
          if (!text) return;

          state.chatMessages.push({ id: Date.now(), sender: 'user', text: text });
          chatInput.value = '';
          state.isChatTyping = true;
          renderTab();

          setTimeout(() => {
            let responseText = '아이고 그래~ 밥 든든하게 먹고 항상 건장하게 지내려무나!';
            if (text.includes('급식') || text.includes('밥')) {
              responseText = `오늘 우리 강아지 학교 급식은 ${state.meals[0] ? state.meals[0].menuTitle : '맛있는 밥'}이 나오는구나! 꼭 다 먹으려무나~`;
            } else if (text.includes('일정') || text.includes('시험') || text.includes('방학')) {
              responseText = `이번 달 학사일정을 보니까 ${state.events[0] ? state.events[0].title : '즐거운 학교생활'} 일정이 있단다!`;
            } else if (text.includes('안녕') || text.includes('할머니')) {
              responseText = '오냐 오냐~ 오늘도 기분 좋은 하루 보내고 복돈이 사과도 잘 챙겨주거라!';
            }

            state.chatMessages.push({ id: Date.now() + 1, sender: 'grandma', text: responseText });
            state.isChatTyping = false;
            renderTab();
          }, 1000);
        };

        btnSendChat.addEventListener('click', handleSend);
        chatInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') handleSend();
        });
      }

      const btnSubmitBoard = document.getElementById('btn-submit-board');
      const boardInput = document.getElementById('board-input-text');
      if (btnSubmitBoard && boardInput) {
        const handleSubmitBoard = () => {
          const text = boardInput.value.trim();
          if (!text) {
            showToast('의견을 입력해주세요.');
            return;
          }
          btnSubmitBoard.disabled = true;
          
          db.collection("feedbacks").add({
            text: text,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          }).then(() => {
            boardInput.value = '';
            showToast('의견이 성공적으로 등록되었습니다.');
            btnSubmitBoard.disabled = false;
          }).catch((error) => {
            console.error("의견 등록 오류:", error);
            showToast('의견 등록에 실패했습니다.');
            btnSubmitBoard.disabled = false;
          });
        };

        btnSubmitBoard.addEventListener('click', handleSubmitBoard);
        boardInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') handleSubmitBoard();
        });
      }
    }

    function renderTab() {
      const mainContent = document.getElementById('main-content');
      if (!mainContent) return;

      if (state.activeTab === 'home') mainContent.innerHTML = renderHomeTab();
      else if (state.activeTab === 'meals') mainContent.innerHTML = renderMealsTab();
      else if (state.activeTab === 'calendar') mainContent.innerHTML = renderCalendarTab();
      else if (state.activeTab === 'pig') mainContent.innerHTML = renderPigTab();
      else if (state.activeTab === 'chat') mainContent.innerHTML = renderChatTab();
      else if (state.activeTab === 'board') mainContent.innerHTML = renderBoardTab();

      lucide.createIcons();
      attachTabEvents();
    }

    function switchTab(tabName) {
      state.activeTab = tabName;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isMatch = btn.dataset.tab === tabName;
        btn.className = `nav-btn flex flex-col items-center justify-center px-3 py-1.5 rounded-xl transition-all ${
          isMatch ? 'text-[#D87A56] font-bold bg-[#F3E2D0]' : 'text-[#8C7462] hover:text-[#5C4535]'
        }`;
      });
      renderTab();
    }

    function changeMonth(delta) {
      let y = parseInt(state.currentYearMonth.slice(0, 4));
      let m = parseInt(state.currentYearMonth.slice(4, 6));

      m += delta;
      if (m > 12) { y += 1; m = 1; }
      else if (m < 1) { y -= 1; m = 12; }

      state.currentYearMonth = `${y}${String(m).padStart(2, '0')}`;
      fetchCalendarData(state.selectedSchool, state.currentYearMonth);
    }

    window.onload = function () {
      db.collection("feedbacks").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const newFeedbacks = [];
        snapshot.forEach(doc => {
          newFeedbacks.push({ id: doc.id, ...doc.data() });
        });
        state.feedbacks = newFeedbacks;
        
        if (state.activeTab === 'board') {
          renderBoardMessages();
        }
      }, (error) => {
        console.error("게시판 불러오기 오류:", error);
      });

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          switchTab(btn.dataset.tab);
        });
      });

      const schoolBadge = document.getElementById('header-school-badge');
      if (schoolBadge) schoolBadge.textContent = state.selectedSchool.name;

      const officeSelect = document.getElementById('office-select');
      if (officeSelect) {
        officeSelect.innerHTML = EDUCATION_OFFICES.map(o => `
          <option value="${o.code}" ${o.code === state.selectedSchool.officeCode ? 'selected' : ''}>${o.name}</option>
        `).join('');
      }

      const modalSchool = document.getElementById('modal-school');
      document.getElementById('btn-open-school')?.addEventListener('click', () => modalSchool?.classList.remove('hidden'));
      document.getElementById('btn-close-school')?.addEventListener('click', () => modalSchool?.classList.add('hidden'));

      const modalApi = document.getElementById('modal-api');
      document.getElementById('btn-open-api')?.addEventListener('click', () => modalApi?.classList.remove('hidden'));
      document.getElementById('btn-close-api')?.addEventListener('click', () => modalApi?.classList.add('hidden'));

      const modalCloset = document.getElementById('modal-closet');
      document.getElementById('btn-close-closet')?.addEventListener('click', () => modalCloset?.classList.add('hidden'));

      document.querySelectorAll('.closet-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeClosetTab = btn.dataset.closetTab;
          document.querySelectorAll('.closet-tab-btn').forEach(b => {
            const isSelected = b.dataset.closetTab === state.activeClosetTab;
            b.className = `closet-tab-btn flex-1 py-1.5 text-center text-xs font-bold rounded-t-lg ${
              isSelected ? 'bg-[#D87A56] text-white' : 'bg-[#EFE3D3] text-[#7C5A38]'
            }`;
          });
          renderClosetItemsGrid();
        });
      });

      document.getElementById('btn-reset-closet')?.addEventListener('click', () => {
        state.tempEquippedItems = { hat: null, necklace: null, pin: null, face: null };
        renderClosetItemsGrid();
      });

      document.getElementById('btn-save-closet')?.addEventListener('click', () => {
        state.equippedItems = JSON.parse(JSON.stringify(state.tempEquippedItems));
        localStorage.setItem('pig_equipped', JSON.stringify(state.equippedItems));
        modalCloset?.classList.add('hidden');
        showToast('✨ 복돈이 옷 꾸미기가 저장되었습니다!');
        renderTab();
      });

      document.getElementById('btn-save-api')?.addEventListener('click', () => {
        const neisKey = document.getElementById('neis-key-input')?.value.trim() || '';
        const geminiKey = document.getElementById('gemini-key-input')?.value.trim() || '';

        state.neisApiKey = neisKey;
        state.geminiApiKey = geminiKey;
        localStorage.setItem('neis_api_key', neisKey);
        localStorage.setItem('gemini_api_key', geminiKey);

        modalApi?.classList.add('hidden');
        showToast('🔑 API 설정이 저장되었습니다.');
        fetchAllData();
      });

      document.getElementById('btn-search-school')?.addEventListener('click', async () => {
        const query = document.getElementById('school-query-input')?.value.trim();
        const officeCode = document.getElementById('office-select')?.value || '';
        const resultsContainer = document.getElementById('school-search-results');

        if (!query) {
          showToast('검색할 학교 이름을 입력해주세요.');
          return;
        }

        if (resultsContainer) {
          resultsContainer.innerHTML = `<div class="text-center py-6 text-xs text-[#8C7462]">나이스(NEIS) 학교 정보를 조회하는 중...</div>`;
        }

        try {
          const apiKeyParam = state.neisApiKey ? `&KEY=${state.neisApiKey}` : '';
          const officeParam = officeCode ? `&ATPT_OFCDC_SC_CODE=${officeCode}` : '';
          const searchUrl = `https://open.neis.go.kr/hub/schoolInfo?Type=json&pIndex=1&pSize=20${apiKeyParam}${officeParam}&SCHUL_NM=${encodeURIComponent(query)}`;

          const res = await fetch(searchUrl);
          const data = await res.json();

          if (data.schoolInfo && data.schoolInfo[1]?.row && resultsContainer) {
            const schools = data.schoolInfo[1].row;
            resultsContainer.innerHTML = schools.map(sch => `
              <div class="p-2.5 bg-white rounded-xl border border-[#E8DCD0] flex justify-between items-center hover:bg-[#FAF3E5] transition-colors">
                <div>
                  <h5 class="font-bold text-xs text-[#4A3B32]">${sch.SCHUL_NM}</h5>
                  <p class="text-[10px] text-[#8C6A50]">${sch.JU_ORG_NM || sch.ATPT_OFCDC_SC_NM} | ${sch.ORG_RDNMA || '주소 정보 없음'}</p>
                </div>
                <button data-code="${sch.SD_SCHUL_CODE}" data-name="${sch.SCHUL_NM}" data-office="${sch.ATPT_OFCDC_SC_CODE}" data-office-name="${sch.ATPT_OFCDC_SC_NM}" class="btn-select-school bg-[#D87A56] hover:bg-[#C26946] text-white px-2.5 py-1 rounded-lg text-xs font-bold transition-all active:scale-95 shadow">
                  선택
                </button>
              </div>
            `).join('');

            document.querySelectorAll('.btn-select-school').forEach(btn => {
              btn.addEventListener('click', () => {
                const schoolObj = {
                  code: btn.dataset.code,
                  name: btn.dataset.name,
                  officeCode: btn.dataset.office,
                  officeName: btn.dataset.officeName
                };
                state.selectedSchool = schoolObj;
                localStorage.setItem('selected_school', JSON.stringify(schoolObj));

                if (schoolBadge) schoolBadge.textContent = schoolObj.name;
                modalSchool?.classList.add('hidden');
                showToast(`🏫 '${schoolObj.name}'(으)로 설정되었습니다.`);
                fetchAllData();
              });
            });
          } else if (resultsContainer) {
            resultsContainer.innerHTML = `<div class="text-center py-6 text-xs text-[#8C6A50]">검색 결과가 없습니다. 학교 이름을 다시 확인해 주세요.</div>`;
          }
        } catch (err) {
          console.error('School Search Error:', err);
          if (resultsContainer) {
            resultsContainer.innerHTML = `<div class="text-center py-6 text-xs text-red-500">학교 정보를 검색하지 못했습니다.</div>`;
          }
        }
      });

      fetchAllData();
    };
  </script>
</body>
</html>
